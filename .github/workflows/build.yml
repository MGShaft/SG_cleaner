name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          
      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5
          
      - name: Create Android Project
        run: |
          echo "include ':app'" > settings.gradle
          echo "plugins { id 'com.android.application' version '8.2.2' apply false; id 'org.jetbrains.kotlin.android' version '1.9.22' apply false }" > build.gradle
          mkdir -p app/src/main/java/com/saintguillaume/cleaner
          mkdir -p app/src/main/res/values
          
          cat > app/src/main/AndroidManifest.xml <<MAN
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application android:label="SG Cleaner">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
              </activity>
            </application>
          </manifest>
          MAN
          
          echo '<resources><string name="app_name">SG Cleaner</string></resources>' > app/src/main/res/values/strings.xml
          
          cat > app/src/main/java/com/saintguillaume/cleaner/MainActivity.kt <<KT
          package com.saintguillaume.cleaner
          import android.os.Bundle
          import android.widget.TextView
          import androidx.appcompat.app.AppCompatActivity
          class MainActivity : AppCompatActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
              super.onCreate(savedInstanceState)
              val tv = TextView(this)
              tv.text = "SG CLEANER v5 - Ca marche enfin Chef!"
              tv.textSize = 24f
              tv.setPadding(40,300,40,40)
              setContentView(tv)
            }
          }
          KT
          
          cat > app/build.gradle <<GR
          plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
          android {
            namespace 'com.saintguillaume.cleaner'
            compileSdk 34
            defaultConfig { applicationId "com.saintguillaume.cleaner"; minSdk 24; targetSdk 34; versionCode 5; versionName "5.0" }
            buildTypes { release { minifyEnabled false } }
            compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          dependencies {
            implementation 'androidx.core:core-ktx:1.12.0'
            implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          GR

      - name: Build APK Debug
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SG-Cleaner-APK
          path: app/build/outputs/apk/debug/app-debug.apk
